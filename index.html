<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Coding Progress</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
font-family:Arial,sans-serif;
max-width:1000px;
margin:40px auto;
padding:20px;
background:#f6f8fa;
color:#24292f;
}
h1{text-align:center}
.stats{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:30px 0;
}
.card{
background:white;
padding:20px 35px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px #0001;
}
.card h2{margin:0 0 8px}
.chart{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 8px #0001;
}
</style>
</head>
<body>

<h1>📊 Daily Coding Progress</h1>

<div class="stats">
<div class="card">
<h2>65</h2>
<div>🟢 LeetCode</div>
</div>

<div class="card">
<h2>35</h2>
<div>🔵 Codeforces</div>
</div>

<div class="card">
<h2>100</h2>
<div>🏆 Total Solved</div>
</div>
</div>

<div class="chart">
<canvas id="progressChart"></canvas>
</div>

<script>
new Chart(document.getElementById("progressChart"),{
type:"doughnut",
data:{
labels:["LeetCode","Codeforces"],
datasets:[{
data:[65,35]
}]
},
options:{
responsive:true,
plugins:{
title:{
display:true,
text:"Problems Solved"
}
}
}
});
</script>

</body>
</html>
